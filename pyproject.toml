[project]
name = "loris"
version = "0.18.0"
classifiers = ["Private :: Do Not Upload"]

requires-python = "~= 3.14.0"
dependencies = [
  # Main API framework
  "litestar ~= 2.24.0",
  # Defining data models
  "pydantic ~= 2.13.0",
  # Loading configuration
  "pydantic-settings ~= 2.15.0",
  # Locking utilities
  "pylocks @ https://github.com/radio-aktywne/pylocks/archive/refs/tags/0.9.0.tar.gz",
  # Storage utilities
  "pystores @ https://github.com/radio-aktywne/pystores/archive/refs/tags/0.10.0.tar.gz",
  # Streaming utilities
  "pystreams @ https://github.com/radio-aktywne/pystreams/archive/refs/tags/0.15.0.tar.gz",
  # Pretty-printing in the terminal
  "rich ~= 15.0.0",
  # Building CLIs
  "typer ~= 0.27.0",
  # Timezone data
  "tzdata",
  # ASGI server
  "uvicorn[standard] ~= 0.54.0",
]

[dependency-groups]
dev = [
  # Template management
  "copier ~= 9.15.0",
  # Testing framework
  "pytest ~= 9.1.0",
  # Asyncio support for pytest
  "pytest-asyncio ~= 1.4.0",
  # Containers interface for testing
  "testcontainers ~= 4.15.0",
]

[project.scripts]
loris = "loris.__main__:cli"

[build-system]
requires = ["uv_build ~= 0.11.0"]
build-backend = "uv_build"

[tool.pyright]
# Analyze code only in these directories
include = ["src/", "tests/"]

# Exclude these directories from analysis
exclude = ["**/node_modules/", "**/__pycache__/", "**/.*/", "plugins/"]

# Specify the path to the virtual environment
venv = ".venv"
venvPath = "./"

# Python version and platform to target
pythonPlatform = "All"
pythonVersion = "3.14"

[tool.pytest.ini_options]
# Remove in the future: https://github.com/pytest-dev/pytest-asyncio/issues/924
asyncio_default_fixture_loop_scope = "function"
